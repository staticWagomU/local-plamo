<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ローカル翻訳へようこそ</title>
<style>
  * { box-sizing: border-box; }
  body { max-width: 560px; margin: 48px auto; padding: 0 20px; font: 15px/1.7 system-ui, sans-serif; color: #1f2933; }
  h1 { display: flex; align-items: center; gap: 10px; font-size: 22px; }
  h1 img { width: 36px; height: 36px; }
  .actions { display: flex; gap: 8px; margin: 20px 0 8px; }
  button { padding: 8px 18px; border: 1px solid #bcccdc; border-radius: 6px; background: #fff; font-size: 15px; cursor: pointer; }
  button.primary { border: none; background: #0f766e; color: #fff; }
  button:disabled { background: #9fb3c8; color: #fff; cursor: default; }
  progress { width: 100%; height: 10px; }
  .note { color: #52606d; font-size: 13px; }
  .ng { color: #b42318; }
  kbd { padding: 0 4px; border: 1px solid #bcccdc; border-radius: 3px; font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1><img src="icon128.png" alt="">ローカル翻訳へようこそ</h1>
  <p>この拡張は翻訳モデルをブラウザの中で動かします。翻訳する文章は外部に送信されません。</p>
  <p>翻訳を始める前に、翻訳モデル (約<span class="size"></span>) を Hugging Face から一度だけダウンロードし、ブラウザに保存します。
    以降は通信なしで翻訳できます。</p>
  <p class="note" id="space"></p>

  <div id="ask">
    <div class="actions">
      <button class="primary" id="download">ダウンロードする (約<span class="size"></span>)</button>
      <button id="later">後で</button>
    </div>
    <p class="note">後でダウンロードする場合は、ツールバーの拡張アイコンから始められます。</p>
  </div>

  <div id="progressBox" hidden>
    <progress id="bar" max="1"></progress>
    <p id="progressText"></p>
    <p class="note">このタブを閉じてもダウンロードは続きます。</p>
  </div>

  <div id="failed" hidden>
    <p class="ng" id="error"></p>
    <div class="actions"><button class="primary" id="retry">再試行</button></div>
  </div>

  <div id="done" hidden>
    <p><strong>準備ができました。</strong>翻訳したいページで拡張アイコンの「このページを翻訳」か <kbd>Alt</kbd>+<kbd>P</kbd> を押してください。
      文章を選択して出る「訳」ボタンでも翻訳できます。</p>
  </div>

  <script src="shared.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
