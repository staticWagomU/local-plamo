<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { width: 300px; margin: 0; padding: 14px; font: 13px/1.5 system-ui, sans-serif; color: #1f2933; }
  h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 15px; }
  h1 img { width: 22px; height: 22px; }
  #status { margin-left: auto; font-size: 11px; font-weight: normal; }
  #status.ok { color: #0f766e; }
  #status.ng { color: #b42318; }
  label { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  select { flex: 1; padding: 3px; }
  #toggle { width: 100%; margin: 8px 0 12px; padding: 8px; border: none; border-radius: 6px;
    background: #0f766e; color: #fff; font-size: 14px; cursor: pointer; }
  #toggle:disabled { background: #9fb3c8; cursor: default; }
  #retry { margin-left: 6px; padding: 0 6px; font-size: 11px; cursor: pointer; }
  fieldset { margin: 10px 0 0; padding: 6px 10px; border: 1px solid #d9e2ec; border-radius: 6px; }
  legend { padding: 0 4px; color: #52606d; font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  .chips button { padding: 1px 8px; border: 1px solid #bcccdc; border-radius: 10px; background: #f0f4f8; font-size: 11px; cursor: pointer; }
  .note { color: #52606d; font-size: 11px; }
  a { color: #0f766e; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1><img src="icon48.png" alt="">ローカル翻訳<span id="status"></span><button id="retry" hidden>再試行</button></h1>

  <label>翻訳先 <select id="targetLang"></select></label>
  <label id="formRow">文体
    <select id="form">
      <option value="polite">です・ます</option>
      <option value="plain">だ・である</option>
    </select>
  </label>

  <button id="toggle" disabled>このページを翻訳</button>

  <fieldset>
    <legend>自動翻訳</legend>
    <label><input type="checkbox" id="autoSite"> <span id="autoSiteLabel">このサイトを常に翻訳</span></label>
    <label id="autoLangRow" hidden><input type="checkbox" id="autoLang"> <span id="autoLangLabel"></span></label>
    <div id="autoLangsBox" hidden>
      <div class="note">常に翻訳する言語 (クリックで解除)</div>
      <div class="chips" id="autoLangs"></div>
    </div>
  </fieldset>

  <fieldset>
    <legend>表示</legend>
    <label><input type="checkbox" id="selection"> 文章を選択したら翻訳ボタンを出す</label>
    <label><input type="checkbox" id="hover"> 訳文にマウスを乗せたら原文を出す</label>
  </fieldset>

  <p class="note">ショートカット: Alt+P でページを翻訳・原文に戻す、Alt+H でホバー表示を切り替え。
    <a href="#" id="shortcuts">変更する</a></p>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
